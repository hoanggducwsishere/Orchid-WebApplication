server.port=8080
spring.application.name=orchid-backend

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:orchid_db}
spring.datasource.username=${DB_USER:orchid_user}
spring.datasource.password=${DB_PASSWORD:orchid_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

orchid.app.jwtSecret=${JWT_SECRET:OrchidAppSuperSecretKeyForJWTAuthTokenGeneration20261234567890!@#$%^&*()}
orchid.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.seed.demo-data=${SEED_DEMO_DATA:false}
app.seed.admin-email=${ADMIN_EMAIL:admin@orchid.vn}
app.seed.admin-password=${ADMIN_PASSWORD:admin123}
