server.port=${PORT:8080}
spring.application.name=orchid-backend

# Cấu hình CSDL PostgreSQL.
# Mặc định trỏ tới Postgres chạy bằng backend/docker-compose.yml để chạy được ở máy local.
# Khi deploy (Render, Docker, ...) hãy đặt các biến môi trường SPRING_DATASOURCE_* để ghi đè.
# Lưu ý: hostname nội bộ của Render (dạng dpg-xxxx-a) chỉ phân giải được bên trong mạng Render,
# nên không bao giờ đặt nó làm giá trị mặc định.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:orchid_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:orchid_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:orchid_password}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

orchid.app.jwtSecret=${JWT_SECRET:OrchidAppSuperSecretKeyForJWTAuthTokenGeneration20261234567890!@#$%^&*()}
orchid.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://*.vercel.app}
app.seed.demo-data=${SEED_DEMO_DATA:true}
app.seed.admin-email=${ADMIN_EMAIL:admin@orchid.vn}
app.seed.admin-password=${ADMIN_PASSWORD:admin123}
